name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Temporarily remove API routes for static export
        run: |
          mv src/app/api src/app/_api_bak
          mv src/app/result src/app/_result_bak

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npx next build

      - name: Restore API routes
        run: |
          mv src/app/_api_bak src/app/api
          mv src/app/_result_bak src/app/result

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
